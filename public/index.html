<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Encarta 95 (interactive)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #viewport { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 8px; box-sizing: border-box; }
    #screen_container { width: min(100%, calc((100vh - 16px) * 4 / 3)); height: min(100%, calc((100vw - 16px) * 3 / 4)); aspect-ratio: 4 / 3; outline: none; background: #000; }
    #screen_container.captured { cursor: none; }
    #screen_container canvas, #screen_container > div { width: 100% !important; height: 100% !important; display: block; }
  </style>
</head>
<body>
  <div id="viewport"><div id="screen_container" tabindex="0" title="Click to capture mouse"></div></div>

  <script src="runtime/libv86.js"></script>
  <script>
    const screen = document.getElementById("screen_container");

    const emulator = new V86({
      wasm_path: "runtime/v86.wasm",
      memory_size: 64 * 1024 * 1024,
      vga_memory_size: 8 * 1024 * 1024,
      screen_container: screen,
      bios: { url: "bios/seabios.bin" },
      vga_bios: { url: "bios/vgabios.bin" },
      cdrom: { url: "disks/encarta95/.iso", size: 675440640, async: true, fixed_chunk_size: 256 * 1024, use_parts: true, synchronous: true },
      hda: { url: "disks/c-drive/.img", size: 471859200, async: true, fixed_chunk_size: 256 * 1024, use_parts: true, synchronous: true },
      initial_state: { url: "state/encarta95.bin" },
      autostart: true,
      disable_audio: true,
    });
    window.emulator = emulator;

    async function focusAndCapture() {
      screen.focus();
      try { if (typeof emulator.lock_mouse === "function") await emulator.lock_mouse(); } catch (_) {}
    }
    screen.addEventListener("mousedown", focusAndCapture);
    screen.addEventListener("click", focusAndCapture);
    document.addEventListener("pointerlockchange", () => {
      screen.classList.toggle("captured", document.pointerLockElement === document.body);
    });
  </script>
</body>
</html>
