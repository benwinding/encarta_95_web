<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Encarta 95 (interactive)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #viewport { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 8px; box-sizing: border-box; }
    #screen_container { width: min(100%, calc((100vh - 16px) * 4 / 3)); height: min(100%, calc((100vw - 16px) * 3 / 4)); aspect-ratio: 4 / 3; outline: none; background: #000; }
    #screen_container canvas, #screen_container > div { width: 100% !important; height: 100% !important; display: block; }

    /*
     * Kiosk shields. These are siblings of #screen_container (NOT children): v86's
     * mouse adapter only forwards events whose target is inside the screen element,
     * so anything here swallows clicks before they reach the guest. They're placed
     * over the Windows 95 title-bar (min/max/close) and the taskbar (Start button),
     * which are the only ways to reach the desktop.
     */
    .shield { position: absolute; z-index: 10; display: none; cursor: default; }
    #shield-titlebar { background: #000; }
    #shield-taskbar { background: #000; }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="screen_container" tabindex="0" title="Click to start"></div>
    <div id="shield-titlebar" class="shield"></div>
    <div id="shield-taskbar" class="shield"></div>
  </div>

  <script src="runtime/libv86.js"></script>
  <script>
    const viewport = document.getElementById("viewport");
    const screen = document.getElementById("screen_container");
    const shieldTitlebar = document.getElementById("shield-titlebar");
    const shieldTaskbar = document.getElementById("shield-taskbar");

    const emulator = new V86({
      wasm_path: "runtime/v86.wasm",
      memory_size: 64 * 1024 * 1024,
      vga_memory_size: 8 * 1024 * 1024,
      screen_container: screen,
      bios: { url: "bios/seabios.bin" },
      vga_bios: { url: "bios/vgabios.bin" },
      cdrom: { url: "disks/encarta95/.iso", size: 675440640, async: true, fixed_chunk_size: 256 * 1024, use_parts: true, synchronous: true },
      hda: { url: "disks/c-drive/.img", size: 471859200, async: true, fixed_chunk_size: 256 * 1024, use_parts: true, synchronous: true },
      initial_state: { url: "state/encarta95.bin" },
      autostart: true,
      disable_audio: true,
    });
    window.emulator = emulator;

    // Guest is 1024x768. Cover the Win95 title bar (top ~28px) and taskbar (~28px).
    const TOP_FRACTION = 28 / 768;
    const BOTTOM_FRACTION = 28 / 768;

    function layoutShields() {
      const c = screen.getBoundingClientRect();
      const v = viewport.getBoundingClientRect();
      const left = c.left - v.left;
      const top = c.top - v.top;

      const topH = Math.round(c.height * TOP_FRACTION);
      const bottomH = Math.round(c.height * BOTTOM_FRACTION);

      Object.assign(shieldTitlebar.style, {
        left: `calc(100% - 49px)`,
        top: `${top}px`,
        width: `${c.width}px`,
        height: `${topH}px`,
      });
      Object.assign(shieldTaskbar.style, {
        left: `${left}px`,
        top: `${top + c.height - bottomH}px`,
        width: `${c.width}px`,
        height: `${bottomH}px`,
      });
    }

    function showShields() {
      layoutShields();
      shieldTitlebar.style.display = "block";
      shieldTaskbar.style.display = "block";
    }

    showShields();
    window.addEventListener("resize", layoutShields);
    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(layoutShields).observe(screen);
    }

    // Block escape hatches that would reveal the desktop.
    const BLOCKED_KEYS = new Set(["F4", "Tab", "Escape"]);
    window.addEventListener(
      "keydown",
      (e) => {
        if ((e.altKey || e.ctrlKey || e.metaKey) && BLOCKED_KEYS.has(e.key)) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      },
      true
    );

    screen.addEventListener("mousedown", () => screen.focus());
  </script>
</body>
</html>
